name: Auto-merge own pull requests

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled

concurrency:
  group: auto-merge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login == 'MuffinzCat' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'manual-review') &&
      github.event.pull_request.head.repo.full_name == 'MuffinzCat/ArtSniffer'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable native squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr view "$PR_URL" --json state,isDraft,baseRefName,headRepository,author,labels |
            jq -e '
              .state == "OPEN" and
              .isDraft == false and
              .baseRefName == "main" and
              .author.login == "MuffinzCat" and
              .headRepository.nameWithOwner == "MuffinzCat/ArtSniffer" and
              all(.labels[]; .name != "manual-review")
            ' >/dev/null; then
            gh pr merge --auto --squash "$PR_URL"
          else
            echo "Pull request is no longer eligible for auto-merge."
          fi

  disable-auto-merge-for-manual-review:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'manual-review' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'MuffinzCat/ArtSniffer'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Disable auto-merge for manual review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --disable-auto "$PR_URL"
