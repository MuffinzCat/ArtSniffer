name: Auto-merge own pull requests

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - unlabeled

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login == 'MuffinzCat' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'manual-review') &&
      github.event.pull_request.head.repo.full_name == 'MuffinzCat/ArtSniffer'
    runs-on: ubuntu-latest
    steps:
      - name: Enable native squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
