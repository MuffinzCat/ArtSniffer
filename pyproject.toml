[project]
name = "artsniffer"
version = "0.1.0"
description = "Self-hosted personalised artwork discovery and recommendation service."
readme = "README.md"
authors = [
    { name = "Muffin" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
artsniffer = "artsniffer:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
    target-version = "py312"
    line-length = 100

[tool.ruff.lint]
    select = [
        "E",
        "F",
        "I",
        "UP",
        "B",
    ]

[tool.pyright]
    pythonVersion = "3.12"
    typeCheckingMode = "standard"
    include = [
        "src",
        "tests",
    ]